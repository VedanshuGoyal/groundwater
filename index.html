    <meta name="theme-color" content="#f9f9f7" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0d0d0d" media="(prefers-color-scheme: dark)" />
    <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
    <link rel="preload" href="./data/2025-2026/summary.json" as="fetch" crossorigin>
    <script>
      // Apply a saved theme before first paint so there is no flash.
      try { const t = localStorage.getItem('theme'); if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t } catch {}
      // Ask for the map archive's header now rather than after the 1 MB map library loads: on a cold CDN
      // (first visit after a quiet spell) this first request is the slow one. The browser caches the reply,
      // so the map's own identical request is answered locally.
      fetch('./tiles/ingres.pmtiles', { headers: { Range: 'bytes=0-16383' } }).catch(() => {})
    </script>
